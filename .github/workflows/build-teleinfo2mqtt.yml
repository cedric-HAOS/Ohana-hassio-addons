name: Build teleinfo2mqtt Ohana

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "teleinfo2mqtt/**"
      - ".github/workflows/build-teleinfo2mqtt.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cedric-haos/teleinfo2mqtt-ohana

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(awk '/^version:/ {print $2; exit}' teleinfo2mqtt/config.yaml)
          test -n "$version"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teleinfo2mqtt/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: teleinfo2mqtt/app/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand

  build:
    needs: [metadata, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
          - arch: armhf
            platform: linux/arm/v6
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: teleinfo2mqtt
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ needs.metadata.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}

  manifest:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifests
        shell: bash
        run: |
          version='${{ needs.metadata.outputs.version }}'
          refs=()
          for arch in amd64 aarch64 armv7 armhf; do
            refs+=("${IMAGE}:${version}-${arch}")
          done
          docker buildx imagetools create -t "${IMAGE}:${version}" "${refs[@]}"
          docker buildx imagetools create -t "${IMAGE}:latest" "${refs[@]}"
